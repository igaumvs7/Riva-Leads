function hRegionalTrimestral() {
  var d = dadosHouse();
  var regs = [{ k:'rene', l:'Regional Rene' }, { k:'cahu', l:'Regional Cah\u00fa' }];
  var tris = [
    { l:'1\u00ba Tri', meses:[0,1,2] },
    { l:'2\u00ba Tri', meses:[3,4,5] },
    { l:'3\u00ba Tri', meses:[6,7,8] },
    { l:'4\u00ba Tri', meses:[9,10,11] }
  ];
  var totaisMeta = [0,0,0,0];
  var totaisReal = [0,0,0,0];

  var rows = regs.map(function(reg) {
    var rd = d.regionais[reg.k] || {};
    var metaAno = 0, realAno = 0, metaCells = '', realCells = '', pctCells = '';
    tris.forEach(function(tri, ti) {
      var meta = 0, real = 0;
      tri.meses.forEach(function(indice) {
        var mk = String(indice + 1).padStart(2,'0');
        var row = rd[mk] || {};
        meta += hParse(row.meta);
        real += hParse(row.realizado);
      });
      metaAno += meta; realAno += real;
      totaisMeta[ti] += meta; totaisReal[ti] += real;
      var percentual = hP(real, meta);
      metaCells += '<td class="hRight"><span class="hValueDanger">' + hFmt(meta) + '</span></td>';
      realCells += '<td class="hRight"><span class="hValueSuccess">' + hFmt(real) + '</span></td>';
      pctCells += '<td class="hRight">' + _saldoComPct(meta, real) + _bar(percentual) + '</td>';
    });
    var percentualAno = hP(realAno, metaAno);
    return '<tr>'
      + '<td class="hSticky hNameCell" rowspan="3">' + hEsc(reg.l) + '</td>'
      + '<td class="hMetricCell isMeta">META</td>' + metaCells
      + '<td class="hRight hYearCell"><span class="hValuePrimary">' + hFmt(metaAno) + '</span></td></tr>'
      + '<tr><td class="hMetricCell isReal">REAL</td>' + realCells
      + '<td class="hRight hYearCell isReal"><span class="hValueSuccess">' + hFmt(realAno) + '</span></td></tr>'
      + '<tr class="hMetricEnd"><td class="hMetricCell">SALDO</td>' + pctCells
      + '<td class="hRight hYearCell">' + _saldoComPct(metaAno, realAno) + _bar(percentualAno) + '</td></tr>';
  }).join('');

  var totalMetaAno = 0, totalRealAno = 0;
  var footer = tris.map(function(tri, ti) {
    totalMetaAno += totaisMeta[ti];
    totalRealAno += totaisReal[ti];
    return '<td class="hRight"><div class="hValueDanger">' + hFmt(totaisMeta[ti]) + '</div>'
      + '<div class="hValueSuccess">' + hFmt(totaisReal[ti]) + '</div>'
      + _pendSpan(totaisMeta[ti], totaisReal[ti]) + '</td>';
  }).join('');

  return '<div class="hCard">'
    + '<div class="hCardHead"><div><div class="hCardTitle">Trimestral por Regional</div>'
    + '<div class="hCardSub">Consolidado automático dos valores mensais de cada regional</div></div>'
    + '<span class="hCardBadge">4 trimestres</span></div>'
    + '<div class="hTableWrap"><table class="hTable">'
    + '<thead><tr><th class="hSticky">Regional</th><th>Indicador</th>'
    + tris.map(function(tri) { return '<th>' + tri.l + '</th>'; }).join('')
    + '<th class="hYearCell">Ano</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '<tfoot><tr class="hTotalRow"><td class="hSticky" colspan="2">TOTAL</td>' + footer
    + '<td class="hRight hTotalStrong"><div class="hValuePrimary">' + hFmt(totalMetaAno) + '</div>'
    + '<div class="hValueSuccess">' + hFmt(totalRealAno) + '</div>' + _pendSpan(totalMetaAno,totalRealAno) + '</td></tr></tfoot>'
    + '</table></div></div>';
}

  var nomeDuplicado = '';
  document.querySelectorAll('.dirNameInput').forEach(function(el) {
    var antigo = el.dataset.nome;
    var novo = (el.value || '').trim();
    if (!novo) {
      el.value = antigo;
      return;
    }
    if (novo !== antigo) {
      if (nd.diretores[novo] && !renames[novo]) nomeDuplicado = novo;
      renames[antigo] = novo;
    }
  });
  if (nomeDuplicado) {
    toast('Já existe uma diretoria chamada "' + nomeDuplicado + '".', true);
    return;
  }
  Object.keys(renames).forEach(function(antigo) {
    var novo = renames[antigo];
    nd.diretores[novo] = nd.diretores[antigo] || {};
    delete nd.diretores[antigo];
  });
  var ordem = (nd.dirNames && nd.dirNames.length) ? nd.dirNames : Object.keys(nd.diretores);
  nd.dirNames = ordem.map(function(nome) { return renames[nome] || nome; })
    .filter(function(nome, i, arr) { return nome && arr.indexOf(nome) === i; });

  S.config[chaveHouse()] = nd;
  persistConfigCache();
  hKpis();
  hTab(window._hTab || 'gv');
  var btn = document.getElementById('hSaveBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '&#8987; Salvando...'; }
  hSetSaveState('Confirmando os dados no servidor...', true);

  var ok = await saveConfig(chaveHouse(), nd);
  if (btn) { btn.disabled = false; btn.innerHTML = '&#128190; Salvar tudo'; }
  if (ok) {
    hSetSaveState('Dados confirmados no servidor', false);
    toast('\u2705 Dados salvos e confirmados!');
  } else {
    hSetSaveState('Cópia local preservada — sincronização pendente', true);
    toast('Sem conexão. Os dados ficaram seguros neste dispositivo.', true);
  }
  hKpis();
}

// ═══════════════════════════════════════════════════════════════
//  RIVA V19 — HOUSE — DESEMPENHO UNIFICADA
//  A tela usa cartões responsivos, sem tabela horizontal.
//  Cada mês preserva meta, valor automático e substituição manual.
// ═══════════════════════════════════════════════════════════════

var HOUSE_V19 = {
  tab:'gv',
  gerente:'',
  diretor:'',
  regional:'rene',
  dirPeriodo:'mensal',
  dirMes:new Date().getMonth(),
  dirTri:Math.floor(new Date().getMonth()/3)
};

function houseV19Linha(valor) {
  var row = valor && typeof valor === 'object' && !Array.isArray(valor) ? valor : {};
  return {
    meta:hParse(row.meta),
    realizado:hParse(row.realizado),
    manual:row.manual === true,
    automatico:0
  };
}

function houseV19IsHumberto(nome) {
  return normExec(nome) === 'humberto';
}

function houseV19LinhaDiretor(valor,nome) {
  var objeto = valor && typeof valor === 'object' && !Array.isArray(valor);
  var row = objeto ? valor : {};
  var legado = objeto ? 0 : hParse(valor);
  var humberto = houseV19IsHumberto(nome);
  return {
    meta:hParse(row.meta),
    realizado:objeto ? hParse(row.realizado) : legado,
    manual:objeto ? row.manual === true : legado > 0,
    metaManual:objeto && Object.prototype.hasOwnProperty.call(row,'metaManual')
      ? row.metaManual === true
      : (!humberto || hParse(row.meta) > 0),
    automatico:hParse(row.automatico),
    metaAutomatico:hParse(row.metaAutomatico)
  };
}

function dadosHouse() {
  var saved = S.config[chaveHouse()];
  if (!saved || typeof saved !== 'object' || Array.isArray(saved)) saved = {};
  var gestores = {};
  getAllGVs(false).forEach(function(item) {
    var nome = typeof item === 'object' ? item.nome : item;
    if (nome) gestores[nome] = true;
  });
  Object.keys((saved && saved.gvs) || {}).forEach(function(nome) { gestores[nome] = true; });
  gestores.Desligados = true;

  var d = {
    metaRiva:hParse(saved.metaRiva),
    riva:{},
    gvs:{},
    diretores:{},
    dirNames:Array.isArray(saved.dirNames) ? saved.dirNames.filter(Boolean) : [],
    regionais:{rene:{},cahu:{}}
  };

  Object.keys((saved && saved.riva) || {}).forEach(function(rivaMk) {
    if (/^(0[1-9]|1[0-2])$/.test(rivaMk)) {
      d.riva[rivaMk] = houseV19Linha(saved.riva[rivaMk]);
    }
  });

  Object.keys(gestores).forEach(function(nome) {
    d.gvs[nome] = {};
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      d.gvs[nome][mk] = houseV19Linha(saved.gvs && saved.gvs[nome] && saved.gvs[nome][mk]);
    }
  });

  ['rene','cahu'].forEach(function(regional) {
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      d.regionais[regional][mk] = houseV19Linha(
        saved.regionais && saved.regionais[regional] && saved.regionais[regional][mk]
      );
    }
  });

  Object.keys((saved && saved.diretores) || {}).forEach(function(nome) {
    d.diretores[nome] = {};
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      var antigo = saved.diretores[nome] && saved.diretores[nome][mk];
      d.diretores[nome][mk] = houseV19LinhaDiretor(antigo,nome);
    }
  });
  if (!d.dirNames.length) d.dirNames = Object.keys(d.diretores);
  if (!d.dirNames.length) {
    d.dirNames = ['Humberto','Diretor 02','Edvan','Mercado'];
    d.dirNames.forEach(function(nome) { d.diretores[nome] = {}; });
  }

  return aplicarRealizadoGestaoHouse(d);
}

function aplicarRealizadoGestaoHouse(d) {
  var ativos = {};
  getAllGVs(false).forEach(function(item) {
    var nome = typeof item === 'object' ? item.nome : item;
    if (nome) ativos[normExec(nome)] = nome;
  });
  if (!d.gvs.Desligados) d.gvs.Desligados = {};

  Object.keys(d.gvs).forEach(function(nome) {
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      if (!d.gvs[nome][mk]) d.gvs[nome][mk] = houseV19Linha();
      d.gvs[nome][mk].automatico = 0;
      if (!d.gvs[nome][mk].manual) d.gvs[nome][mk].realizado = 0;
    }
  });
  ['rene','cahu'].forEach(function(regional) {
    if (!d.regionais[regional]) d.regionais[regional] = {};
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      if (!d.regionais[regional][mk]) d.regionais[regional][mk] = houseV19Linha();
      d.regionais[regional][mk].automatico = 0;
      if (!d.regionais[regional][mk].manual) d.regionais[regional][mk].realizado = 0;
    }
  });

  (S.vendas || []).forEach(function(venda) {
    if (!vendaComunicadaExec(venda)) return;
    var mes = mesVendaExec(venda);
    if (mes.slice(0,4) !== String(S.ano)) return;
    var mk = mes.slice(5,7);
    if (!/^\d{2}$/.test(mk)) return;
    var info = infoVendaExecutiva(venda);
    var gerente = ativos[normExec(info.gv)] || 'Desligados';
    if (!d.gvs[gerente]) d.gvs[gerente] = {};
    if (!d.gvs[gerente][mk]) d.gvs[gerente][mk] = houseV19Linha();
    var valor = num(venda.vgv || venda.valor);
    d.gvs[gerente][mk].automatico += valor;
    if (!d.gvs[gerente][mk].manual) d.gvs[gerente][mk].realizado += valor;

    if (info.reg && d.regionais[info.reg]) {
      if (!d.regionais[info.reg][mk]) d.regionais[info.reg][mk] = houseV19Linha();
      d.regionais[info.reg][mk].automatico += valor;
      if (!d.regionais[info.reg][mk].manual) d.regionais[info.reg][mk].realizado += valor;
    }
  });

  houseV19Diretores(d).forEach(function(nome) {
    if (!d.diretores[nome]) d.diretores[nome] = {};
    var humberto = houseV19IsHumberto(nome);
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      if (!d.diretores[nome][mk] || typeof d.diretores[nome][mk] !== 'object') {
        d.diretores[nome][mk] = houseV19LinhaDiretor(d.diretores[nome][mk],nome);
      }
      var row = d.diretores[nome][mk];
      row.automatico = humberto
        ? hParse(d.regionais.rene[mk] && d.regionais.rene[mk].realizado)
          + hParse(d.regionais.cahu[mk] && d.regionais.cahu[mk].realizado)
        : 0;
      row.metaAutomatico = humberto
        ? hParse(d.regionais.rene[mk] && d.regionais.rene[mk].meta)
          + hParse(d.regionais.cahu[mk] && d.regionais.cahu[mk].meta)
        : 0;
      if (!row.manual) row.realizado = row.automatico;
      if (!row.metaManual) row.meta = row.metaAutomatico;
    }
  });
  return d;
}

function houseV19Serializar(d) {
  var limpo = {
    metaRiva:hParse(d.metaRiva),
    riva:{},
    gvs:{},
    diretores:{},
    dirNames:(d.dirNames || []).slice(),
    regionais:{rene:{},cahu:{}}
  };
  Object.keys(d.riva || {}).forEach(function(rivaMk) {
    if (!/^(0[1-9]|1[0-2])$/.test(rivaMk)) return;
    var rivaRow = d.riva[rivaMk] || {};
    limpo.riva[rivaMk] = {
      meta:hParse(rivaRow.meta),
      realizado:hParse(rivaRow.realizado),
      manual:rivaRow.manual === true
    };
  });
  Object.keys(d.gvs || {}).forEach(function(nome) {
    limpo.gvs[nome] = {};
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      var row = d.gvs[nome][mk] || {};
      limpo.gvs[nome][mk] = {
        meta:hParse(row.meta),
        realizado:hParse(row.realizado),
        manual:row.manual === true
      };
    }
  });
  ['rene','cahu'].forEach(function(regional) {
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      var row = d.regionais[regional][mk] || {};
      limpo.regionais[regional][mk] = {
        meta:hParse(row.meta),
        realizado:hParse(row.realizado),
        manual:row.manual === true
      };
    }
  });
  Object.keys(d.diretores || {}).forEach(function(nome) {
    limpo.diretores[nome] = {};
    for (var m = 1; m <= 12; m++) {
      var mk = String(m).padStart(2,'0');
      var row = houseV19LinhaDiretor(d.diretores[nome][mk],nome);
      limpo.diretores[nome][mk] = {
        meta:hParse(row.meta),
        realizado:hParse(row.realizado),
        manual:row.manual === true,
        metaManual:row.metaManual === true
      };
    }
  });
  return limpo;
}

function houseV19Gerentes() {
  var nomes = getAllGVs(false).map(function(item) {
    return typeof item === 'object' ? item.nome : item;
  }).filter(Boolean);
  if (nomes.indexOf('Desligados') < 0) nomes.push('Desligados');
  return nomes.filter(function(nome, indice, lista) { return lista.indexOf(nome) === indice; });
}

function houseV19Diretores(d) {
  var nomes = (d.dirNames || []).filter(Boolean);
  Object.keys(d.diretores || {}).forEach(function(nome) {
    if (nomes.indexOf(nome) < 0) nomes.push(nome);
  });
  if (!nomes.length) nomes = ['Humberto','Diretor 02','Edvan','Mercado'];
  return nomes;
}

function houseV19Selecionado(tipo, lista) {
  var chave = tipo === 'gv' ? 'gerente' : (tipo === 'dir' ? 'diretor' : 'regional');
  var atual = HOUSE_V19[chave];
  if (!atual || lista.indexOf(atual) < 0) {
    atual = lista[0] || '';
    HOUSE_V19[chave] = atual;
  }
  return atual;
}

function houseV19LinhaTipo(d, tipo, nome, mk) {
  if (tipo === 'dir') {
    return houseV19LinhaDiretor(d.diretores[nome] && d.diretores[nome][mk],nome);
  }
  var grupo = tipo === 'gv' ? d.gvs : d.regionais;
  return houseV19LinhaEfetiva(grupo[nome] && grupo[nome][mk]);
}

function houseV19LinhaEfetiva(row) {
  row = row || {};
  return {
    meta:hParse(row.meta),
    realizado:hParse(row.realizado),
    manual:row.manual === true,
    automatico:hParse(row.automatico)
  };
}

function houseV19Totais(d, tipo, nome, indices) {
  indices = indices || _MS3.map(function(_,i) { return i; });
  return indices.reduce(function(total, indice) {
    var mk = String(indice + 1).padStart(2,'0');
    var row = houseV19LinhaTipo(d,tipo,nome,mk);
    total.meta += row.meta;
    total.realizado += row.realizado;
    if (row.manual) total.manuais++;
    return total;
  },{meta:0,realizado:0,manuais:0});
}

function houseV19Resumo(totais, tipo) {
  var percentual = hP(totais.realizado, totais.meta);
  var saldo = hSaldo(totais.meta, totais.realizado);
  if (tipo === 'dir') {
    return '<div class="hv19Summary">'
      + '<article class="hv19Kpi"><span>Meta anual</span><strong>'+hFmt(totais.meta)+'</strong><small>'+S.ano+'</small></article>'
      + '<article class="hv19Kpi success"><span>Realizado anual</span><strong>'+hFmt(totais.realizado)+'</strong><small>'+percentual+'% da meta</small></article>'
      + '<article class="hv19Kpi '+(totais.realizado >= totais.meta && totais.meta ? 'success' : 'danger')+'"><span>'+saldo.label+'</span><strong>'+saldo.valor+'</strong><small>Saldo anual</small></article>'
      + '<article class="hv19Kpi"><span>Origem dos valores</span><strong>'+totais.manuais+'</strong><small>mês'+(totais.manuais !== 1 ? 'es' : '')+' com realizado manual</small></article>'
      + '</div>';
  }
  return '<div class="hv19Summary">'
    + '<article class="hv19Kpi"><span>Meta acumulada</span><strong>'+hFmt(totais.meta)+'</strong><small>'+S.ano+'</small></article>'
    + '<article class="hv19Kpi success"><span>Realizado</span><strong>'+hFmt(totais.realizado)+'</strong><small>'+percentual+'% da meta</small></article>'
    + '<article class="hv19Kpi '+(totais.realizado >= totais.meta && totais.meta ? 'success' : 'danger')+'"><span>'+saldo.label+'</span><strong>'+saldo.valor+'</strong><small>Saldo anual</small></article>'
    + '<article class="hv19Kpi"><span>Origem dos valores</span><strong>'+totais.manuais+'</strong><small>mês'+(totais.manuais !== 1 ? 'es' : '')+' preenchido'+(totais.manuais !== 1 ? 's' : '')+' manualmente</small></article>'
    + '</div>';
}

function houseV19MonthCard(d,tipo,nome,indice) {
  var mk = String(indice + 1).padStart(2,'0');
  var row = houseV19LinhaTipo(d,tipo,nome,mk);
  var percentual = hP(row.realizado,row.meta);
  var agora = new Date();
  var atual = Number(S.ano) === agora.getFullYear() && indice === agora.getMonth();
  var origem = row.manual ? 'manual' : 'auto';
  var status = row.manual ? 'MANUAL' : (tipo === 'dir' && !houseV19IsHumberto(nome) ? 'EM ABERTO' : 'AUTOMÁTICO');
  if (tipo === 'dir') {
    return '<button type="button" class="hv19Month'+(atual?' current':'')+'" data-type="'+tipo+'" data-name="'+hEsc(nome)+'" data-mes="'+mk+'" onclick="houseV19OpenMonth(this.dataset.type,this.dataset.name,this.dataset.mes)">'
      + '<span class="hv19MonthHead"><strong>'+MS[indice]+'</strong><span class="hv19Pill '+origem+'">'+status+'</span></span>'
      + '<span class="hv19MonthNumbers"><span class="hv19MonthMetric"><span>Meta</span><strong>'+hFmt(row.meta)+'</strong></span>'
      + '<span class="hv19MonthMetric"><span>Realizado</span><strong>'+hFmt(row.realizado)+'</strong></span></span>'
      + '<span class="hv19MonthFoot"><span>'+percentual+'% da meta</span><span>'+hSaldo(row.meta,row.realizado).valor+'</span></span>'
      + '<span class="hv19Progress"><i style="width:'+Math.min(100,percentual)+'%"></i></span>'
      + '<span class="hv19MonthEdit"><span>CLIQUE PARA EDITAR</span><span>Meta + realizado →</span></span></button>';
  }
  return '<button type="button" class="hv19Month'+(atual?' current':'')+'" data-type="'+tipo+'" data-name="'+hEsc(nome)+'" data-mes="'+mk+'" onclick="houseV19OpenMonth(this.dataset.type,this.dataset.name,this.dataset.mes)">'
    + '<span class="hv19MonthHead"><strong>'+MS[indice]+'</strong><span class="hv19Pill '+origem+'">'+status+'</span></span>'
    + '<span class="hv19MonthValue">'+hFmt(row.realizado)+'</span>'
    + '<span class="hv19MonthMeta">Meta '+hFmt(row.meta)+'</span>'
    + '<span class="hv19MonthFoot"><span>'+percentual+'% da meta</span><span>'+hSaldo(row.meta,row.realizado).valor+'</span></span><span class="hv19Progress"><i style="width:'+Math.min(100,percentual)+'%"></i></span>'
    + '</button>';
}

function houseV19MonthGrid(d,tipo,nome) {
  return '<div class="hv19SectionLabel">Todos os meses de '+S.ano+' · clique em um mês para editar</div>'
    + '<div class="hv19MonthGrid">'+_MS3.map(function(_,indice) {
      return houseV19MonthCard(d,tipo,nome,indice);
    }).join('')+'</div>';
}

function houseV19QuarterCard(d,tipo,nome,trimestre,clicavel) {
  var inicio = trimestre * 3;
  var indices = [inicio,inicio+1,inicio+2];
  var totais = houseV19Totais(d,tipo,nome,indices);
  var percentual = hP(totais.realizado,totais.meta);
  var tag = clicavel ? 'button' : 'article';
  var attrs = clicavel
    ? ' type="button" data-type="'+tipo+'" data-name="'+hEsc(nome)+'" data-q="'+trimestre+'" onclick="houseV19OpenQuarter(this.dataset.type,this.dataset.name,Number(this.dataset.q))"'
    : '';
  return '<'+tag+' class="hv19Quarter"'+attrs+'>'
    + '<h4>'+(trimestre+1)+'º Trimestre</h4><strong>'+hFmt(totais.realizado)+'</strong>'
    + '<small>Meta '+hFmt(totais.meta)+' · '+percentual+'%</small>'
    + '<span class="hv19Progress"><i style="width:'+Math.min(100,percentual)+'%"></i></span>'
    + '<span class="hv19QuarterMonths">'+indices.map(function(i){ return '<span>'+_MS3[i]+'</span>'; }).join('')+'</span>'
    + '</'+tag+'>';
}

function houseV19QuarterGrid(d,tipo,nome,clicavel) {
  return '<div class="hv19SectionLabel">Visão trimestral</div><div class="hv19QuarterGrid">'
    + [0,1,2,3].map(function(q) { return houseV19QuarterCard(d,tipo,nome,q,clicavel); }).join('')
    + '</div>';
}

function houseV19Options(lista,selecionado) {
  return lista.map(function(nome) {
    return '<option value="'+hEsc(nome)+'"'+(nome === selecionado ? ' selected' : '')+'>'+hEsc(nome)+'</option>';

}

function houseV19DiretorIndices() {
  if (HOUSE_V19.dirPeriodo === 'mensal') return [HOUSE_V19.dirMes];
  if (HOUSE_V19.dirPeriodo === 'trimestral') {
    var inicio = HOUSE_V19.dirTri * 3;
    return [inicio,inicio+1,inicio+2];
  }
  return _MS3.map(function(_,indice){ return indice; });
}

function houseV19DiretorPeriodoLabel() {
  if (HOUSE_V19.dirPeriodo === 'mensal') return MS[HOUSE_V19.dirMes]+' de '+S.ano;
  if (HOUSE_V19.dirPeriodo === 'trimestral') {
    return (HOUSE_V19.dirTri+1)+'º trimestre de '+S.ano;
  }
  return 'Ano '+S.ano;
}

function houseV19SetDirPeriod(periodo) {
  if (['mensal','trimestral','anual'].indexOf(periodo) < 0) return;
  HOUSE_V19.dirPeriodo = periodo;
  houseV19RenderActive();
}

function houseV19SetDirMonth(valor) {
  HOUSE_V19.dirMes = Math.max(0,Math.min(11,parseInt(valor,10) || 0));
  houseV19RenderActive();
}

function houseV19SetDirQuarter(valor) {
  HOUSE_V19.dirTri = Math.max(0,Math.min(3,parseInt(valor,10) || 0));
  houseV19RenderActive();
}

function houseV19SelectDirectorFromCompare(nome) {
  HOUSE_V19.diretor = nome;
  houseV19RenderActive();
  setTimeout(function() {
    var detalhe = document.getElementById('hv19DirectorDetail');
    if (detalhe && window.matchMedia('(max-width:700px)').matches) {
      detalhe.scrollIntoView({behavior:'smooth',block:'start'});
    }
  },0);
}

function houseV19ComparativoDiretores(d,lista,selecionado) {
  var indices = houseV19DiretorIndices();
  var periodo = houseV19DiretorPeriodoLabel();
  var dados = lista.map(function(nome) {
    var totais = houseV19Totais(d,'dir',nome,indices);
    return {
      nome:nome,
      valor:totais.realizado,
      meta:totais.meta,
      percentual:hP(totais.realizado,totais.meta)
    };
  }).sort(function(a,b) {
    if (b.valor !== a.valor) return b.valor-a.valor;
    return a.nome.localeCompare(b.nome,'pt-BR');
  });
  var total = dados.reduce(function(soma,item){ return soma+item.valor; },0);
  var totalMeta = dados.reduce(function(soma,item){ return soma+item.meta; },0);
  var atingimento = hP(total,totalMeta);
  var maior = dados.length ? dados[0].valor : 0;
  var lider = dados.length ? dados[0].nome : '—';
  var melhorMeta = dados.slice().sort(function(a,b) {
    if (b.percentual !== a.percentual) return b.percentual-a.percentual;
    return b.valor-a.valor;
  })[0] || {nome:'—',percentual:0};
  var pendente = Math.max(0,totalMeta-total);
  var seletor = '';
  if (HOUSE_V19.dirPeriodo === 'mensal') {
    seletor = '<select class="hv19ComparePeriod" aria-label="Mês do comparativo" onchange="houseV19SetDirMonth(this.value)">'
      +MS.map(function(nome,indice){ return '<option value="'+indice+'"'+(indice === HOUSE_V19.dirMes ? ' selected' : '')+'>'+nome+'</option>'; }).join('')
      +'</select>';
  } else if (HOUSE_V19.dirPeriodo === 'trimestral') {
    seletor = '<select class="hv19ComparePeriod" aria-label="Trimestre do comparativo" onchange="houseV19SetDirQuarter(this.value)">'
      +[0,1,2,3].map(function(indice){ return '<option value="'+indice+'"'+(indice === HOUSE_V19.dirTri ? ' selected' : '')+'>'+(indice+1)+'º Trimestre</option>'; }).join('')
      +'</select>';
  }
  var cards = dados.map(function(item,indice) {
    var participacao = total > 0 ? Math.round(item.valor/total*100) : 0;
    var progresso = item.meta > 0 ? Math.min(100,item.percentual) : 0;
    var saldo = hSaldo(item.meta,item.valor);
    return '<button type="button" class="hv19CompareCard'+(indice === 0 ? ' leader' : '')+(item.nome === selecionado ? ' selected' : '')+'"'
      +' data-name="'+hEsc(item.nome)+'" onclick="houseV19SelectDirectorFromCompare(this.dataset.name)" aria-pressed="'+(item.nome === selecionado ? 'true' : 'false')+'">'
      +'<span class="hv19CompareCardHead"><span class="hv19CompareRank">'+(indice+1)+'º</span><span class="hv19CompareName">'+hEsc(item.nome)+'</span>'
      +(indice === 0 ? '<span class="hv19CompareTag">LÍDER</span>' : '')+'</span>'
      +'<strong class="hv19CompareValue">'+hFmt(item.valor)+'</strong>'
      +'<span class="hv19CompareMeta"><span>Meta<b>'+hFmt(item.meta)+'</b></span><span>Atingimento<b>'+item.percentual+'%</b></span>'
      +'<span>Participação<b>'+participacao+'% do total</b></span><span>'+hEsc(saldo.label)+'<b>'+hEsc(saldo.valor)+'</b></span></span>'
      +'<span class="hv19CompareProgress" style="--hv19-progress:'+progresso+'%" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+item.percentual+'"><span></span></span></button>';
  }).join('');
  return '<div class="hv19Compare period-'+HOUSE_V19.dirPeriodo+'"><div class="hv19CompareHead"><div><h4>Comparativo entre Diretores</h4>'
    +'<p>Ranking por realizado, com meta, atingimento e saldo · '+hEsc(periodo)+'</p></div>'
    +'<div class="hv19CompareControls"><div class="hv19Segmented" aria-label="Período do comparativo">'
    +'<button class="'+(HOUSE_V19.dirPeriodo === 'mensal' ? 'active' : '')+'" onclick="houseV19SetDirPeriod(\'mensal\')">Mensal</button>'
    +'<button class="'+(HOUSE_V19.dirPeriodo === 'trimestral' ? 'active' : '')+'" onclick="houseV19SetDirPeriod(\'trimestral\')">Trimestral</button>'
    +'<button class="'+(HOUSE_V19.dirPeriodo === 'anual' ? 'active' : '')+'" onclick="houseV19SetDirPeriod(\'anual\')">Anual</button></div>'+seletor+'</div></div>'
    +'<div class="hv19CompareSummary">'
    +'<article class="hv19CompareStat"><span>Realizado das diretorias</span><strong>'+hFmt(total)+'</strong><small>'+atingimento+'% da meta consolidada</small></article>'
    +'<article class="hv19CompareStat"><span>Meta consolidada</span><strong>'+hFmt(totalMeta)+'</strong><small>'+hEsc(periodo)+'</small></article>'
    +'<article class="hv19CompareStat"><span>Líder do período</span><strong>'+hEsc(lider)+'</strong><small>'+hFmt(maior)+'</small></article>'
    +'<article class="hv19CompareStat"><span>Melhor atingimento</span><strong>'+hEsc(melhorMeta.nome)+'</strong><small>'+melhorMeta.percentual+'% da meta</small></article>'
    +'<article class="hv19CompareStat"><span>Pendente consolidado</span><strong>'+hFmt(pendente)+'</strong><small>Para atingir a meta do período</small></article></div>'
    +'<div class="hv19CompareList">'+(cards || '<div class="hv19Empty">Nenhuma diretoria cadastrada.</div>')+'</div></div>';
}

function afterHouse() {
  var ano = document.getElementById('houseAno');
  if (ano) ano.onchange = function() {
    var novo = Math.max(2020,Math.min(2099,parseInt(this.value,10) || S.ano));
    S.ano = novo;
    S.mes = novo+'-'+String(new Date().getMonth()+1).padStart(2,'0');
    renderPage();
  };
  houseV19RenderActive();
}

function hKpis() { houseV19RenderGlobal(); }

function houseV19RenderGlobal() {
  var el = document.getElementById('hv19Global');
  if (!el) return;
  var d = dadosHouse();
  var metaInput = document.getElementById('hMetaRiva');
  if (metaInput && document.activeElement !== metaInput) {
    metaInput.value = d.metaRiva ? hFmt(d.metaRiva) : '';
  }
  var nomes = houseV19Gerentes();
  var totais = nomes.reduce(function(total,nome) {
    var t = houseV19Totais(d,'gv',nome);
    total.meta += t.meta;
    total.realizado += t.realizado;
    return total;
  },{meta:0,realizado:0});
  var referencia = d.metaRiva || totais.meta;
  var percentual = hP(totais.realizado,referencia);
  var saldo = hSaldo(referencia,totais.realizado);
  el.innerHTML = '<article class="hv19Kpi success"><span>Realizado House</span><strong>'+hFmt(totais.realizado)+'</strong><small>'+percentual+'% da meta de referência</small></article>'
    +'<article class="hv19Kpi"><span>Soma das metas</span><strong>'+hFmt(totais.meta)+'</strong><small>Metas mensais dos gerentes</small></article>'
    +'<article class="hv19Kpi '+(totais.realizado >= referencia && referencia ? 'success' : 'danger')+'"><span>'+saldo.label+'</span><strong>'+saldo.valor+'</strong><small>Resultado do ano</small></article>';
}

function houseV19PendingKey() {
  return perfStorageKey('house_patches');
}

function houseV19PendingList() {
  try {
    var lista = JSON.parse(localStorage.getItem(houseV19PendingKey()) || '[]');
    return Array.isArray(lista) ? lista : [];
  } catch(e) { return []; }
}

function houseV19SetPendingList(lista) {
  try { localStorage.setItem(houseV19PendingKey(),JSON.stringify(lista || [])); } catch(e) {}
}

function houseV19QueuePatch(pacote) {
  var lista = houseV19PendingList();
  pacote.id = pacote.id || ('house-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));
  lista.push(pacote);
  houseV19SetPendingList(lista);
}

async function houseV19PostPatch(pacote) {
  var resposta = await fetchWithTimeout(SU,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({
      action:'salvarHousePatch',
      ano:pacote.ano,
      patch:pacote.patch || {},
      removerDiretores:pacote.removerDiretores || [],
      token:S.user.token || ''
    })
  },15000);
  if (!resposta.ok) throw new Error('Falha HTTP '+resposta.status);
  var texto = await resposta.text();
  var retorno = {};
  try { retorno = texto ? JSON.parse(texto) : {}; } catch(e) {}
  if (retorno.status && retorno.status !== 'ok') {
    throw new Error(retorno.msg || retorno.message || retorno.error || 'Servidor recusou a alteração da House.');
  }
  if (retorno.house && typeof retorno.house === 'object') {
    S.config['house_'+pacote.ano] = retorno.house;
    persistConfigCache();
  }
  return retorno;
}

async function houseV19RetryPending() {
  var lista = houseV19PendingList();
  if (!lista.length) return true;
  var restantes = [];
  for (var i = 0; i < lista.length; i++) {
    try {
      await houseV19PostPatch(lista[i]);
    } catch(e) {
      restantes = lista.slice(i);
      break;
    }
  }
  houseV19SetPendingList(restantes);
  return !restantes.length;
}

async function houseV19Persistir(d,botao,patch,removerDiretores) {
  var limpo = houseV19Serializar(d);
  S.config[chaveHouse()] = limpo;
  persistConfigCache();
  window._houseDirty = true;
  if (botao) {
    botao.disabled = true;
    botao.dataset.original = botao.textContent;
    botao.textContent = 'Salvando...';
  }
  var estado = document.getElementById('hv19ModalState');
  if (estado) estado.textContent = 'Confirmando os dados na nuvem...';
  var pacote = {
    ano:S.ano,
    patch:patch || limpo,
    removerDiretores:removerDiretores || []
  };
  var ok = false;
  setSyn('loading');
  try {
    await houseV19PostPatch(pacote);
    ok = true;
    setSyn('ok');
  } catch(e) {
    houseV19QueuePatch(pacote);
    setSyn('offline');
  }
  if (botao) {
    botao.disabled = false;
    botao.textContent = botao.dataset.original || 'Salvar';
  }
  if (ok) {
    window._houseDirty = false;
    if (estado) estado.textContent = 'Dados confirmados.';
    try {
      window.dispatchEvent(new CustomEvent('riva:house-atualizada',{detail:{ano:S.ano}}));
    } catch(e) {}
    return true;
  }
  window._houseDirty = false;
  if (estado) estado.textContent = 'Sem conexão. Os dados ficaram guardados neste dispositivo.';
  toast('Sem conexão. Os dados foram preservados para sincronizar depois.',true);
  return false;
}

async function houseV19RenameDirector() {
  var d = dadosHouse();
  var antigo = houseV19Selecionado('dir',houseV19Diretores(d));
  var novo = prompt('Novo nome da diretoria:',antigo);
  if (!novo || !novo.trim() || novo.trim() === antigo) return;
  novo = novo.trim();
  if (houseV19Diretores(d).some(function(item){ return item !== antigo && normExec(item) === normExec(novo); })) {
    toast('Já existe uma diretoria com esse nome.',true);
    return;
  }
  d.diretores[novo] = d.diretores[antigo] || {};
  delete d.diretores[antigo];
  d.dirNames = houseV19Diretores(d).map(function(item){ return item === antigo ? novo : item; })
    .filter(function(item,indice,lista){ return lista.indexOf(item) === indice; });
  HOUSE_V19.diretor = novo;
  var patch = {diretores:{},dirNames:d.dirNames.slice()};
  patch.diretores[novo] = Object.assign({},d.diretores[novo] || {});
  if (await houseV19Persistir(d,null,patch,[antigo])) {
    houseV19RenderActive();

async function houseV19RemoveDirector() {
  var d = dadosHouse();
  var lista = houseV19Diretores(d);

}

    +'<small>'+(mes.meta?'Meta '+hFmt(mes.meta)+' · '+percentualMes+'% da meta':'Meta não definida · '+percentualMes+'%')+'</small></button>'

    +'<span class="rivaV20KpiLabel">Meta anual<i>'+(ano.metaDireta?'CLIQUE PARA EDITAR':'CLIQUE PARA PREENCHER')+'</i></span><strong>'+hFmt(ano.meta)+'</strong>'

function rivaV19Body() {
  var meses = dadosRivaAno();
  var indiceMes = Math.max(0,Math.min(11,parseInt(String(S.mes || '').split('-')[1],10)-1 || 0));
  var mes = meses[indiceMes];
  var ano = rivaV20DadosAnuais(meses);
  var agora = new Date();
  var maximo = Math.max.apply(null,meses.map(function(item){ return item.vgv; }).concat([1]));
  var barras = meses.map(function(item) {
    var futuro = Number(S.ano) > agora.getFullYear() || (Number(S.ano) === agora.getFullYear() && item.indice > agora.getMonth());
    var atual = Number(S.ano) === agora.getFullYear() && item.indice === agora.getMonth();
    var altura = futuro ? 0 : Math.max(2,Math.round(item.vgv/maximo*100));
    return '<div class="rivaV19Bar'+(atual?' current':'')+(futuro?' future':'')+'" title="'+hEsc(item.nome+' · '+hFmt(item.vgv))+'">'
      +'<span class="rivaV19BarValue">'+(futuro?'—':brl(item.vgv))+'</span><span class="rivaV19Track"><i class="rivaV19Fill" style="height:'+altura+'%"></i></span>'
      +'<span class="rivaV19BarLabel">'+item.nome+'</span></div>';
  }).join('');
  var cardsMes = meses.map(function(item) {
    var futuro = Number(S.ano) > agora.getFullYear() || (Number(S.ano) === agora.getFullYear() && item.indice > agora.getMonth());
    var atual = Number(S.ano) === agora.getFullYear() && item.indice === agora.getMonth();
    var selecionado = item.indice === indiceMes;
    var percentual = item.meta > 0 ? Math.round(item.vgv/item.meta*100) : 0;
    var status = item.manual ? 'MANUAL' : (atual?'PARCIAL':futuro?'EM ABERTO':item.vendas+' venda'+(item.vendas !== 1 ? 's' : ''));
    return '<button type="button" class="rivaMonthCard editable'+(atual?' current':'')+(selecionado?' selected':'')+(futuro?' future':'')+(item.manual?' manual':'')+'" onclick="rivaV20OpenMonth(\''+String(item.indice+1).padStart(2,'0')+'\')" aria-label="Editar '+hEsc(item.nome)+'"><header><strong>'+item.nome+'</strong><span>'
      +status+'</span></header>'
      +'<strong>'+hFmt(item.vgv)+'</strong><small>'+(item.meta?'Meta '+hFmt(item.meta)+' · '+percentual+'%':'Meta não definida')+'</small>'
      +'<div class="rivaProgress"><i style="width:'+Math.min(100,percentual)+'%"></i></div></button>';
  }).join('');
  var quarters = [0,1,2,3].map(function(q) {
    var dados = somarRivaPeriodo(meses.slice(q*3,q*3+3));
    var percentual = dados.meta > 0 ? Math.round(dados.vgv/dados.meta*100) : 0;
    return '<article class="rivaV19Quarter"><span>'+(q+1)+'º Trimestre · '+_MS3[q*3]+' a '+_MS3[q*3+2]+'</span>'
      +'<strong>'+hFmt(dados.vgv)+'</strong><small>'+dados.vendas+' venda'+(dados.vendas !== 1 ? 's' : '')+(dados.meta?' · Meta '+hFmt(dados.meta)+' · '+percentual+'%':'')+'</small>'
      +'<div class="rivaProgress"><i style="width:'+Math.min(100,percentual)+'%"></i></div></article>';
  }).join('');
  return rivaV20TopCards(mes,ano,indiceMes)
    +'<section class="rivaV19Chart"><header class="rivaV19ChartHead"><div><h3>Evolução mensal do VGV comunicado</h3><p>Janeiro a dezembro · adapta-se à largura da tela sem barra horizontal</p></div><span class="hCardBadge">'+S.ano+'</span></header>'
    +'<div class="rivaV19Bars">'+barras+'</div></section>'
    +'<section class="hCard"><header class="hCardHead"><div><div class="hCardTitle">RIVA Vendas por mês</div><div class="hCardSub">Clique em qualquer mês para informar a meta e, quando necessário, substituir o realizado automático</div></div></header>'
    +'<div class="rivaMonthGrid">'+cardsMes+'</div></section>'
    +'<section><div class="hv19SectionLabel" style="padding:0 0 10px">Consolidado trimestral</div><div class="rivaV19QuarterGrid">'+quarters+'</div></section>';
}

function rivaV20AtualizarCalculoAnual() {

  if (percentual) percentual.textContent = hP(realizado,meta)+'%';
  if (pendente) pendente.textContent = meta ? rivaV20ValorComZero(Math.max(0,meta-realizado)) : '—';

async function rivaV20SaveAnnualMeta() {
  var input = document.getElementById('rivaV20AnnualMeta');
  if (!input) return;
  var d = dadosHouse();
  d.metaRiva = hParse(input.value);

function rivaV20ValorEfetivoModal() {
  var manual = document.getElementById('rivaV20Manual');
  var realizado = document.getElementById('rivaV20Realizado');
  if (!realizado) return 0;
  return manual && manual.checked ? hParse(realizado.value) : hParse(realizado.dataset.auto);
}

function rivaV20AtualizarCalculo() {
  var meta = hParse((document.getElementById('rivaV20Meta') || {}).value);
  var realizado = rivaV20ValorEfetivoModal();
  var percentual = document.getElementById('rivaV20Percentual');
  var pendente = document.getElementById('rivaV20Pendente');
  if (percentual) percentual.textContent = hP(realizado,meta)+'%';
  if (pendente) pendente.textContent = meta ? rivaV20ValorComZero(Math.max(0,meta-realizado)) : '—';
}

function rivaV20ToggleManual() {
  var check = document.getElementById('rivaV20Manual');
  var realizado = document.getElementById('rivaV20Realizado');
  if (!check || !realizado) return;
  realizado.disabled = !check.checked;
  if (!check.checked) {
    var automatico = hParse(realizado.dataset.auto);
    realizado.value = automatico ? hFmt(automatico) : '';
  } else {
    realizado.focus();
    realizado.select();
  }
  rivaV20AtualizarCalculo();
}

function rivaV20CloseModal() {
  var modal = document.getElementById('rivaV20Modal');
  if (modal) {
    modal.classList.remove('open');
    modal.innerHTML = '';
  }
  document.body.style.overflow = '';
}

async function rivaV20SaveMonth() {
  var modal = document.getElementById('rivaV20Modal');
  if (!modal) return;
  var mk = modal.dataset.mes;
  if (!/^(0[1-9]|1[0-2])$/.test(String(mk || ''))) return;
  var manual = !!(document.getElementById('rivaV20Manual') || {}).checked;
  var meta = hParse((document.getElementById('rivaV20Meta') || {}).value);
  var realizado = rivaV20ValorEfetivoModal();
  var d = dadosHouse();
  if (!d.riva) d.riva = {};
  d.riva[mk] = {meta:meta,realizado:realizado,manual:manual,automatico:0};
  var patch = {riva:{}};
  patch.riva[mk] = {meta:meta,realizado:realizado,manual:manual};
  var ok = await houseV19Persistir(d,document.getElementById('rivaV20SaveMonth'),patch);
  if (ok) {
    rivaV20CloseModal();
    rivaV19RenderContent();
    toast('Meta, realizado e percentual do mês foram atualizados!');
  }
}

var _eqTab = 'rene';
var _eqEmailsRegionaisDraft = {rene:'',cahu:''};
function setEqTab(t){
  _eqTab = t;
  document.querySelectorAll('.hTab[data-eq]').forEach(function(b){ b.classList.toggle('on', b.dataset.eq===t); });
  document.getElementById('eqLbl').textContent = 'EQUIPE '+(t==='rene'?'RENE':'CAHÚ');
  renderEquipes();
}
function afterEquipes(){
  _eqDraft = JSON.parse(JSON.stringify(getEquipes()));
  _eqEmailsRegionaisDraft = JSON.parse(JSON.stringify(getEmailsRegionais()));
  var rene=document.getElementById('eqEmailRene'), cahu=document.getElementById('eqEmailCahu');
  if(rene) rene.value=_eqEmailsRegionaisDraft.rene||'';
  if(cahu) cahu.value=_eqEmailsRegionaisDraft.cahu||'';
  renderEquipes();
}
function renderEquipes(){
  if(!_eqDraft) _eqDraft = JSON.parse(JSON.stringify(getEquipes()));
  var lista = _eqDraft[_eqTab] || [];
  var body = lista.map(function(p, i){
    var desligado = p.ativo===false;
    return '<tr'+(desligado?' style="opacity:.55"':'')+'>'
      + '<td class="strong">'+(i+1)+'</td>'
      + '<td><input class="pIn" type="text" data-idx="'+i+'" data-k="nome" value="'+esc(p.nome||'')+'" placeholder="Nome" style="text-align:left;font-weight:750"></td>'
      + '<td><input class="pIn" type="email" data-idx="'+i+'" data-k="email" value="'+esc(p.email||'')+'" placeholder="email@exemplo.com" style="text-align:left"></td>'
      + '<td style="text-align:center"><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:750;color:'+(desligado?'#dc2626':'#15a46f')+'"><input type="checkbox" data-idx="'+i+'" data-k="ativo" '+(!desligado?'checked':'')+' onchange="toggleAtivo('+i+', this.checked)">'+(desligado?'Desligado':'Ativo')+'</label></td>'
      + '<td style="text-align:center"><button onclick="removerGV('+i+')" title="Remover" style="background:none;border:0;color:#dc2626;cursor:pointer;font-size:16px">🗑</button></td>'
      + '</tr>';
  }).join('');
  if(!lista.length){
    body = '<tr><td colspan="5" style="padding:40px;text-align:center;color:var(--muted)">Nenhum GV cadastrado. Clique em "Adicionar GV".</td></tr>';
  }
  document.getElementById('eqBody').innerHTML = body;

  // hook nos inputs
  document.querySelectorAll('#eqBody input.pIn').forEach(function(inp){
    inp.addEventListener('input', function(){
      var i = parseInt(this.dataset.idx), k = this.dataset.k;
      _eqDraft[_eqTab][i][k] = this.value.trim();
      window._equipesDirty=true;
    });
  });

  // KPIs
  var eqAtivos = { rene:0, cahu:0 }, eqDeslig = { rene:0, cahu:0 };
  ['rene','cahu'].forEach(function(r){
    (_eqDraft[r]||[]).forEach(function(p){
      if(p.ativo===false) eqDeslig[r]++;
      else eqAtivos[r]++;
    });
  });
  var totAtivos = eqAtivos.rene + eqAtivos.cahu;
  var totDeslig = eqDeslig.rene + eqDeslig.cahu;
  document.getElementById('eqKpis').innerHTML = ''
    + '<div class="pKpi ok"><span>Ativos Rene</span><strong>'+eqAtivos.rene+'</strong><small>gerentes de vendas</small></div>'
    + '<div class="pKpi ok"><span>Ativos Cahú</span><strong>'+eqAtivos.cahu+'</strong><small>gerentes de vendas</small></div>'
    + '<div class="pKpi"><span>Total Ativos</span><strong>'+totAtivos+'</strong><small>house completa</small></div>'
    + '<div class="pKpi dan"><span>Desligados</span><strong>'+totDeslig+'</strong><small>histórico preservado</small></div>';
}
function toggleAtivo(i, checked){
  _eqDraft[_eqTab][i].ativo = checked;
  window._equipesDirty=true;
  renderEquipes();
}
function adicionarGV(){
  var nome = prompt('Nome do novo GV:');
  if(!nome || !nome.trim()) return;
  if(!_eqDraft[_eqTab]) _eqDraft[_eqTab] = [];
  _eqDraft[_eqTab].push({nome:nome.trim(), email:'', ativo:true});
  window._equipesDirty=true;
  renderEquipes();
}
function removerGV(i){
  var p = _eqDraft[_eqTab][i];
  if(!confirm('Remover DEFINITIVAMENTE '+p.nome+'? (para preservar histórico, prefira marcar como Desligado)')) return;
  _eqDraft[_eqTab].splice(i, 1);
  window._equipesDirty=true;
  renderEquipes();
}
function esc(s){ return String(s||'').replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
function salvarEquipes(){
  // Coleta valores do draft
  document.querySelectorAll('#eqBody input.pIn').forEach(function(inp){
    var i = parseInt(inp.dataset.idx), k = inp.dataset.k;
    if(_eqDraft[_eqTab][i]) _eqDraft[_eqTab][i][k] = inp.value.trim();
  });
  var emailsRegionais={
    rene:(document.getElementById('eqEmailRene')||{}).value||'',
    cahu:(document.getElementById('eqEmailCahu')||{}).value||''
  };
  emailsRegionais.rene=emailsRegionais.rene.trim();
  emailsRegionais.cahu=emailsRegionais.cahu.trim();
  var invalidos=[];
  if(emailsRegionais.rene&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailsRegionais.rene)) invalidos.push('Rene');
  if(emailsRegionais.cahu&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailsRegionais.cahu)) invalidos.push('Cahú');
  (_eqDraft.rene||[]).concat(_eqDraft.cahu||[]).forEach(function(p){
    if(p.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) invalidos.push(p.nome||'GV sem nome');
  });
  if(invalidos.length){
    toast('E-mail inválido em: '+invalidos.join(', '),true);
    return;
  }

  // ── Sincronizar S.config.equipes (para HIER e emails) ──
  S.config.equipes = _eqDraft;
  S.config.emailsRegionais = emailsRegionais;

  // ── Sincronizar S.pessoas com a equipe atual ──
  // Pega os regionais de S.pessoas para obter seus IDs
  var regMap = {}; // nome lowercase → pessoa (Gerente Regional)
  (S.pessoas || []).forEach(function(p){
    if(p.cargo === 'Gerente Regional'){
      regMap[p.nome.toLowerCase().trim()] = p;
    }
  });
  // Mapas conhecidos: rene → "Rene", cahu → "Cahú"
  var regKeys = {
    rene: Object.keys(regMap).find(function(k){ return /rene/i.test(k); }) || '',
    cahu: Object.keys(regMap).find(function(k){ return /cah/i.test(k); }) || ''
  };

  ['rene','cahu'].forEach(function(regKey){
    var regNomeKey = regKeys[regKey];
    var regPessoa  = regNomeKey ? regMap[regNomeKey] : null;
    if(!regPessoa) return; // regional não cadastrado em S.pessoas
    var regId = regPessoa.id;

    var equipe = (_eqDraft[regKey] || []);
    equipe.forEach(function(membro){
      if(!membro || !membro.nome) return;
      var nomeLower = membro.nome.toLowerCase().trim();
      // Procurar em S.pessoas
      var pessoa = (S.pessoas || []).find(function(p){
        return p.nome.toLowerCase().trim() === nomeLower && p.cargo === 'Gerente de Vendas';
      });
      if(membro.ativo === false){
        // Desligado: remove da equipe desse regional (limpa superior se for desse regional)
        if(pessoa && pessoa.superior === regId){
          pessoa.superior = '';
        }
      } else {
        if(pessoa){
          // Já existe: atualiza superior
          pessoa.superior = regId;
        } else {
          // Novo membro: cria em S.pessoas
          var novoId = 'gv_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
          S.pessoas.push({
            id: novoId,
            nome: membro.nome.trim(),
            cargo: 'Gerente de Vendas',
            superior: regId
          });
        }
      }
    });

    // Remove de S.pessoas qualquer GV que não está mais na equipe desse regional
    var nomesAtivos = equipe
      .filter(function(m){ return m && m.nome && m.ativo !== false; })
      .map(function(m){ return m.nome.toLowerCase().trim(); });

    (S.pessoas || []).forEach(function(p){
      if(p.cargo === 'Gerente de Vendas' && p.superior === regId){
        var estaNaEquipe = nomesAtivos.indexOf(p.nome.toLowerCase().trim()) >= 0;
        if(!estaNaEquipe){
          p.superior = ''; // remove do regional mas mantém cadastrado
        }
      }
    });
  });

  // Persiste
  saveConfigMap({equipes:_eqDraft, emailsRegionais:emailsRegionais}).then(function(ok){
    if(ok) window._equipesDirty=false;
    toast(ok ? 'Equipes salvas e hierarquia atualizada!' : 'Salvo local. Sem conexão.', !ok);
  });
}

  return ''
    + '<div class="modulePage settingsPage">'
    +   '<section class="moduleHeader"><div><span class="eyebrow">PREFERÊNCIAS DO SISTEMA</span><h1>Configurações</h1><p>Personalize a aparência do painel executivo.</p></div></section>'
    +   '<section class="panel settingsPanel">'
    +     '<div class="panelHeader"><div><span class="eyebrow">APARÊNCIA</span><h3>Escolha o tema</h3></div></div>'
    +     '<div class="themeChoices">'
    +       '<button class="themeChoice '+(!isDark?'selected':'')+'" onclick="setTemaPerf(\'claro\')">'
    +         '<span class="themePreview lightPreview"><i></i><i></i><i></i></span>'
    +         '<span class="themeChoiceCopy"><b>'+sun+' Tema claro</b><small>Fundo branco, leitura leve e visual executivo.</small></span>'
    +         '<em>'+(!isDark?'✓':'')+'</em>'
    +       '</button>'
    +       '<button class="themeChoice '+(isDark?'selected':'')+'" onclick="setTemaPerf(\'escuro\')">'
    +         '<span class="themePreview darkPreview"><i></i><i></i><i></i></span>'
    +         '<span class="themeChoiceCopy"><b>'+moon+' Tema escuro</b><small>Gradiente preto e azul-marinho para pouca luz.</small></span>'
    +         '<em>'+(isDark?'✓':'')+'</em>'
    +       '</button>'
    +     '</div>'
    +   '</section>'
    +   '<section class="panel preferenceInfo"><div>'+gear+'<span><strong>Sessão</strong><small>Conectado como <b id="cfgUser">—</b></small></span><button class="secondaryButton" onclick="doLogout()" style="color:#dc2626;border-color:#f5c9c9;margin-left:auto">Sair do sistema</button></div></section>'
    + '</div>';
}
function afterSettings(){
  var u=document.getElementById('cfgUser'); if(u) u.textContent=(S.user.usuario||'—')+' ('+(S.user.cargo||'')+')';
}
function setTemaPerf(tema){
  if(window.RivaConfig) window.RivaConfig.salvar(tema);
  toast((tema==='escuro'||tema==='dark')?'Tema escuro aplicado!':'Tema claro aplicado!');
  renderPage();
}
